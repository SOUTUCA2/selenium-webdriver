<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>Cadastro de demonstração</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <section class="card" aria-labelledby="page-title">
        <h1 id="page-title">Crie seu cadastro</h1>
        <p class="intro">Preencha os campos para ver o fluxo de teste de interface em ação.</p>

        <form id="signup-form">
          <label for="name">Nome completo</label>
          <input id="name" name="name" type="text" placeholder="Ex.: Ana Silva" autocomplete="name" required>

          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" placeholder="ana@exemplo.com" autocomplete="email" required>

          <label for="password">Senha</label>
          <input id="password" name="password" type="password" placeholder="Mínimo de 8 caracteres" autocomplete="new-password" minlength="8" required>

          <button type="submit">Criar cadastro <span aria-hidden="true">→</span></button>
        </form>

        <p id="confirmation" class="confirmation" role="status" aria-live="polite" hidden></p>
        <p class="footnote">Seus dados ficam apenas nesta demonstração local.</p>
      </section>
    </main>
  </body>
</html>
